[project]
name = "five-hundred-ai"
version = "0.1.0"
description = "A clean-room Python engine for the play phase of 500, and the benchmark harness for beating its hand-tuned CPU."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fivehundred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
